name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: macOS media script smoke test
        if: runner.os == 'macOS'
        # No players run on the CI runner, so the real osascript must return
        # an empty list. Proves macOS parses the script and the "not running"
        # path works without any permission prompt.
        run: |
          out="$(osascript -l JavaScript internal/platform/darwin/media.js pause '[]')"
          echo "pause -> $out"
          test "$out" = "[]"
          out="$(osascript -l JavaScript internal/platform/darwin/media.js resume '[{"app":"Spotify","title":""}]')"
          echo "resume -> $out"
          test "$out" = "[]"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet every target
        run: |
          for os in windows darwin linux; do
            GOOS=$os go vet ./...
          done
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14
      - name: lint windows backend
        run: GOOS=windows golangci-lint run ./...
      - name: build every target
        run: sh scripts/build-dist.sh
