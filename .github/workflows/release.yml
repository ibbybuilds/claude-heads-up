name: release

# Tag vX.Y.Z on main to release. The marketplace installs from the `release`
# branch, which this workflow rebuilds as: the tagged source + dist/ binaries.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Build binaries
        run: VERSION="$GITHUB_REF_NAME" sh scripts/build-dist.sh

      - name: Stamp plugin version
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' .claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp .claude-plugin/plugin.json

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > checksums.txt)
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

      - name: Update release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          rm dist/checksums.txt
          git add -f dist .claude-plugin/plugin.json
          git commit -m "chore: release $GITHUB_REF_NAME"
          git push --force origin release
